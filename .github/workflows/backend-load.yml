name: Backend load benchmark
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: 'Real API origin (read-only, 1 request/second)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  real-api-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:load
        env:
          LOAD_BASE_URL: ${{ inputs.api_origin }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-api-results
          path: backend/test/load/results/*.json
          if-no-files-found: warn
