name: Backend checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/export-openapi.cjs --check
      - run: node --test ../ops/test/*.test.mjs
  database:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate PostgreSQL tools
        shell: pwsh
        run: |
          $pg = Get-ChildItem 'C:/Program Files/PostgreSQL/*/bin/psql.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$pg) { throw 'PostgreSQL tools are required' }
          Split-Path $pg.FullName | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix backend
      - name: Rehearse R2 database, staff MFA and private media
        shell: pwsh
        run: |
          npm --prefix backend run test:r2:db
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix backend run test:auth:db
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix backend run test:media:db
          exit $LASTEXITCODE
