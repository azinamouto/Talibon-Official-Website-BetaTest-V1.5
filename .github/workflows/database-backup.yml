name: Encrypted production database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
permissions:
  contents: read
concurrency:
  group: production-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-operations
    env:
      PGHOST: ${{ secrets.PRODUCTION_PGHOST }}
      PGPORT: ${{ secrets.PRODUCTION_PGPORT }}
      PGUSER: ${{ secrets.PRODUCTION_PGUSER }}
      PGPASSWORD: ${{ secrets.PRODUCTION_PGPASSWORD }}
      PGDATABASE: ${{ vars.PRODUCTION_PGDATABASE }}
      PGSSLMODE: verify-full
      PGCHANNELBINDING: require
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install encryption tool
        run: sudo apt-get update && sudo apt-get install -y age postgresql-client
      - name: Dump and encrypt (plaintext never uploaded)
        shell: bash
        run: |
          set -euo pipefail
          : "${PGHOST:?}" "${PGUSER:?}" "${PGPASSWORD:?}" "${PGDATABASE:?}" "${AGE_RECIPIENT:?}"
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir -p ops/backups
          # Auth tables, application schemas and all R2 ledgers travel together.
          pg_dump --format=custom --no-owner --file="$scratch/database.dump"
          age -r "$AGE_RECIPIENT" -o ops/backups/database.tar.age "$scratch/database.dump"
          test -s ops/backups/database.tar.age
          cd ops/backups
          sha256sum database.tar.age > database.tar.age.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: ops/backups/
          retention-days: 30
          if-no-files-found: error
      - name: Notify backup failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node ops/alert.mjs
