name: Encrypted production database backup
on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
permissions:
  contents: read
concurrency:
  group: production-database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.PRODUCTION_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-operations
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_CLI_VERSION: ${{ vars.SUPABASE_CLI_VERSION }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install encryption tool
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Dump and encrypt (plaintext never uploaded)
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?}" "${AGE_RECIPIENT:?}"
          [[ "$SUPABASE_CLI_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          umask 077
          scratch=$(mktemp -d)
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir -p ops/backups
          # Supabase's CLI excludes provider-owned internals that plain pg_dump cannot restore.
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump --db-url "$SUPABASE_DB_URL" --role-only -f "$scratch/roles.sql"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump --db-url "$SUPABASE_DB_URL" -f "$scratch/schema.sql"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -x storage.buckets_vectors -x storage.vector_indexes -f "$scratch/data.sql"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump --db-url "$SUPABASE_DB_URL" --schema supabase_migrations -f "$scratch/history_schema.sql"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump --db-url "$SUPABASE_DB_URL" --schema supabase_migrations --data-only --use-copy -f "$scratch/history_data.sql"
          tar -C "$scratch" -cf - roles.sql schema.sql data.sql history_schema.sql history_data.sql | age -r "$AGE_RECIPIENT" > ops/backups/database.tar.age
          test -s ops/backups/database.tar.age
          cd ops/backups
          sha256sum database.tar.age > database.tar.age.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-${{ github.run_id }}
          path: ops/backups/
          retention-days: 30
          if-no-files-found: error
      - name: Notify backup failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node ops/alert.mjs
