name: R2 runtime exclusion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node ops/check-runtime.mjs
      - run: npm ci && npm ci --prefix backend && npm ci --prefix frontend
      - run: npm run build
      - run: node ops/check-runtime.mjs --artifacts
